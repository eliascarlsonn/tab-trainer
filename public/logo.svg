<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Tab Trainer</title>
  <defs>
    <linearGradient id="copper" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#e2a575" />
      <stop offset="1" stop-color="#a5582e" />
    </linearGradient>
    <!-- Strings stop just short of the pick's inner edge. -->
    <clipPath id="inside">
      <path d="M50 19C69 19 81.5 25.5 81.5 35.5 81.5 48.5 62 72.5 50 84 38 72.5 18.5 48.5 18.5 35.5 18.5 25.5 31 19 50 19Z" />
    </clipPath>
    <!-- A small gap around each fret dot. -->
    <mask id="gaps">
      <rect width="100" height="100" fill="#fff" />
      <g fill="#000">
        <circle cx="33.3" cy="31.7" r="3.7" />
        <circle cx="38.6" cy="39.1" r="3.7" />
        <circle cx="43.9" cy="46.5" r="3.7" />
        <circle cx="49.4" cy="53.9" r="3.7" />
        <circle cx="56.1" cy="61.3" r="3.7" />
        <circle cx="61.4" cy="68.7" r="3.7" />
      </g>
    </mask>
  </defs>
  <g clip-path="url(#inside)" mask="url(#gaps)" stroke="#5a6873" stroke-width="1.3">
    <path d="M0 31.7H100M0 39.1H100M0 46.5H100M0 53.9H100M0 61.3H100M0 68.7H100" />
  </g>
  <g fill="url(#copper)">
    <circle cx="33.3" cy="31.7" r="2.7" />
    <circle cx="38.6" cy="39.1" r="2.7" />
    <circle cx="43.9" cy="46.5" r="2.7" />
    <circle cx="49.4" cy="53.9" r="2.7" />
    <circle cx="56.1" cy="61.3" r="2.7" />
    <circle cx="61.4" cy="68.7" r="2.7" />
  </g>
  <path
    d="M50 13C72 13 88 21 88 35 88 50 66 77 54 88.5 52 90.5 48 90.5 46 88.5 34 77 12 50 12 35 12 21 28 13 50 13Z"
    fill="none"
    stroke="url(#copper)"
    stroke-width="4.8"
    stroke-linejoin="round"
  />
</svg>
